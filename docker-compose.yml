services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escalate
      POSTGRES_USER: escalate
      POSTGRES_PASSWORD: escalate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalate -d escalate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_LAYA: "false"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DATABASE_URL: postgresql+psycopg://escalate:escalate@postgres:5432/escalate
      AUTO_ROUTE_CONFIDENCE: ${AUTO_ROUTE_CONFIDENCE:-0.90}
      CONFIRMATION_CONFIDENCE: ${CONFIRMATION_CONFIDENCE:-0.70}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-https://api.hubapi.com}
      HUBSPOT_TICKETS_PATH: ${HUBSPOT_TICKETS_PATH:-/crm/v3/objects/tickets}
      HUBSPOT_TIMEOUT_SECONDS: ${HUBSPOT_TIMEOUT_SECONDS:-10}
      HUBSPOT_SYNC_PAGE_SIZE: ${HUBSPOT_SYNC_PAGE_SIZE:-100}
      HUBSPOT_TITLE_PROPERTY: ${HUBSPOT_TITLE_PROPERTY:-subject}
      HUBSPOT_DESCRIPTION_PROPERTY: ${HUBSPOT_DESCRIPTION_PROPERTY:-content}
      HUBSPOT_CUSTOMER_NAME_PROPERTY: ${HUBSPOT_CUSTOMER_NAME_PROPERTY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
