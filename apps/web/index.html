<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Escalate support ticket triage dashboard" />
    <title>Escalate — Triage Operations</title>
    <script>
      // Apply the stored theme before first paint so dark mode never flashes light.
      try {
        var t = JSON.parse(localStorage.getItem('escalate.theme'));
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
